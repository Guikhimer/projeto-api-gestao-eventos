<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-body">
    <div class="blob blob-1"></div>
    <div class="blob blob-3"></div>

    <nav class="glass-nav">
        <div class="nav-content">
            <h1>EventHub</h1>
            <div class="user-menu">
                <button id="btn-logout" class="btn btn-outline">Sair</button>
            </div>
        </div>
    </nav>

    <main class="dashboard-container">
        <header class="dashboard-header">
            <h2>Meus Eventos</h2>
            <button id="btn-open-modal" class="btn btn-primary">+ Novo Evento</button>
        </header>

        <div class="error-message" id="dashboard-error"></div>

        <div class="events-grid" id="events-container">
            <!-- Eventos serão carregados aqui via JS -->
            <div class="loading-spinner">Carregando eventos...</div>
        </div>
    </main>

    <!-- Modal Novo Evento -->
    <div id="event-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-btn">&times;</span>
            <h2>Criar Novo Evento</h2>
            <form id="event-form">
                <div class="input-group">
                    <label for="evento-titulo">Título</label>
                    <input type="text" id="evento-titulo" required placeholder="Nome do Evento">
                </div>
                <div class="input-group">
                    <label for="evento-descricao">Descrição</label>
                    <textarea id="evento-descricao" required placeholder="Detalhes sobre o evento" rows="3"></textarea>
                </div>
                <div class="input-group">
                    <label for="evento-data">Data</label>
                    <input type="date" id="evento-data" required>
                </div>
                <div class="input-group">
                    <label for="evento-local">Local</label>
                    <input type="text" id="evento-local" required placeholder="Endereço ou Link">
                </div>
                <button type="submit" class="btn btn-primary">Salvar Evento</button>
            </form>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
